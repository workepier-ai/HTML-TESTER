<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Triton Scan">
  <meta name="theme-color" content="#000000">

  <title>Triton Scanner</title>

  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Triton Scanner","short_name":"Triton","start_url":"./","display":"standalone","background_color":"%23ffffff","theme_color":"%23000000","orientation":"portrait","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22110%22 fill=%22%23000000%22/><text x=%22256%22 y=%22340%22 font-family=%22-apple-system,system-ui,sans-serif%22 font-size=%22260%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22>T</text></svg>","sizes":"512x512","type":"image/svg+xml","purpose":"any"}]}'>
  <link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="%23000000"/><text x="256" y="340" font-family="-apple-system,system-ui,sans-serif" font-size="260" font-weight="700" fill="white" text-anchor="middle">T</text></svg>'>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* High-contrast topbar */
    .topbar {
      padding: calc(env(safe-area-inset-top) + 14px) 14px 14px;
      background: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .topbar .title {
      flex: 1; text-align: center;
      font-weight: 700; font-size: 18px; letter-spacing: 0.3px;
    }
    .topbar .left, .topbar .right {
      min-width: 70px; display: flex; align-items: center;
    }
    .topbar .right { justify-content: flex-end; }
    .topbar button {
      background: transparent; border: 0; color: #ffffff;
      font-size: 17px; font-weight: 600;
      padding: 6px 10px; cursor: pointer;
    }
    .topbar .save-btn {
      background: #ffffff; color: #000000;
      border-radius: 8px; padding: 8px 16px; font-weight: 800;
    }
    .topbar .save-btn:disabled { opacity: 0.35; }
    .records-count {
      background: #fff; color: #000;
      border-radius: 10px; padding: 4px 10px;
      font-weight: 800; font-size: 14px;
    }

    /* ============ HOME ============ */
    #home { display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; }
    .records {
      flex: 1; overflow-y: auto; padding: 8px;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 110px;
    }
    .record {
      background: #ffffff; border-radius: 12px; padding: 14px;
      margin-bottom: 8px; border: 1px solid #d0d0d0;
      position: relative;
    }
    .record .top-line {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .record .swatch {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0;
    }
    .record .trim { font-weight: 800; font-size: 17px; }
    .record .body-line { color: #000; font-size: 14px; }
    .record .meta {
      display: flex; gap: 14px;
      color: #333; font-size: 14px; margin-top: 6px; font-weight: 600;
      font-family: "SF Mono", Menlo, monospace;
    }
    .record .vin {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 11px; color: #777; margin-top: 4px;
    }
    .record .del {
      position: absolute; top: 8px; right: 8px;
      background: transparent; border: 0; color: #999;
      font-size: 20px; padding: 4px 10px; cursor: pointer;
    }
    .empty {
      text-align: center; padding: 60px 30px; color: #444;
      font-size: 16px; line-height: 1.5;
    }
    .empty .big { font-size: 56px; margin-bottom: 14px; color: #000; }

    .fab {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 22px);
      right: 22px;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: #000000; color: #ffffff; border: 0;
      font-size: 38px; font-weight: 300; line-height: 70px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      cursor: pointer; z-index: 5;
    }
    .fab:active { transform: scale(0.93); }

    /* ============ SCAN ============ */
    #scan { display: none; height: 100vh; background: black; position: relative; }
    #scan video { width: 100%; height: 100%; object-fit: cover; }
    #scan canvas { display: none; }
    .scan-banner {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 12px; right: 12px;
      background: rgba(0,0,0,0.78);
      color: white;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 17px; font-weight: 700;
      text-align: center; line-height: 1.3;
    }
    .scan-banner.success { background: rgba(0, 160, 80, 0.95); }
    .viewfinder {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 75%; max-width: 320px;
      aspect-ratio: 1;
      pointer-events: none;
    }
    .viewfinder::before, .viewfinder::after,
    .viewfinder > div::before, .viewfinder > div::after {
      content: ''; position: absolute;
      width: 32px; height: 32px;
      border: 4px solid rgba(255,255,255,0.95);
    }
    .viewfinder::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
    .viewfinder::after  { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
    .viewfinder > div::before { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
    .viewfinder > div::after  { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }

    .scan-cancel {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom) + 30px);
      left: 50%; transform: translateX(-50%);
      padding: 14px 32px;
      background: rgba(0,0,0,0.7);
      color: white; border-radius: 30px; border: 2px solid rgba(255,255,255,0.6);
      font-size: 17px; font-weight: 700;
    }

    /* Saved toast on scan screen */
    .toast {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 70px);
      left: 50%; transform: translateX(-50%) translateY(-30px);
      background: #00a050; color: white;
      padding: 14px 24px; border-radius: 30px;
      font-weight: 800; font-size: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============ ENTRY ============ */
    #entry { display: none; flex-direction: column; height: 100vh; background: #f5f5f5; }
    .entry-body {
      flex: 1; overflow-y: auto; padding: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .vin-pill {
      background: #000; color: #fff;
      padding: 10px 14px; border-radius: 10px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 14px; font-weight: 800;
      text-align: center; margin-bottom: 6px; letter-spacing: 0.5px;
    }
    .vin-decoded {
      color: #000; font-size: 14px; text-align: center;
      margin-bottom: 14px; font-weight: 700;
    }

    .section-label {
      font-size: 12px; font-weight: 800;
      color: #000; letter-spacing: 1.2px;
      text-transform: uppercase;
      margin: 12px 4px 6px;
    }

    /* Colour grid */
    .colours {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .colour-btn {
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 6px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      min-height: 86px;
    }
    .colour-btn:active { transform: scale(0.95); }
    .colour-btn.selected {
      border-color: #000; border-width: 4px;
      background: #ebebeb;
    }
    .colour-btn .swatch {
      width: 100%; aspect-ratio: 1.4 / 1;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .colour-btn .name {
      font-size: 11px; font-weight: 800;
      text-align: center; line-height: 1.1;
      color: #000;
    }

    /* Trim buttons */
    .trims { display: grid; gap: 8px; }
    .trims.cols-1 { grid-template-columns: 1fr; }
    .trims.cols-2 { grid-template-columns: 1fr 1fr; }
    .trims.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .trims.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .trim-btn {
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 18px 8px;
      font-size: 19px; font-weight: 800;
      color: #000;
      cursor: pointer;
      text-align: center;
    }
    .trim-btn:active { transform: scale(0.95); }
    .trim-btn.selected {
      background: #000; color: #fff;
      border-color: #000;
    }

    /* Text input fields */
    .field-row {
      display: flex; align-items: center;
      background: #fff;
      border: 3px solid #ccc;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 8px;
      gap: 12px;
    }
    .field-row:focus-within { border-color: #000; }
    .field-row label {
      font-size: 13px; font-weight: 800;
      color: #000; letter-spacing: 0.5px;
      text-transform: uppercase;
      min-width: 72px;
    }
    .field-row input {
      flex: 1;
      border: 0; outline: 0; background: transparent;
      font-size: 20px; font-weight: 800;
      color: #000;
      font-family: "SF Mono", Menlo, monospace;
      padding: 6px 0;
      min-width: 0;
    }
  </style>
</head>
<body>

  <!-- ============ HOME ============ -->
  <div id="home">
    <div class="topbar">
      <div class="left"><button onclick="exportCSV()">Export</button></div>
      <div class="title">Triton</div>
      <div class="right"><span class="records-count" id="recCount">0</span></div>
    </div>
    <div class="records" id="records"></div>
    <button class="fab" id="fab">+</button>
  </div>

  <!-- ============ SCAN ============ -->
  <div id="scan">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-banner" id="banner">Scan VIN QR code</div>
    <div class="viewfinder"><div></div></div>
    <button class="scan-cancel" onclick="cancelScan()">Cancel</button>
    <div class="toast" id="scanToast"></div>
  </div>

  <!-- ============ ENTRY ============ -->
  <div id="entry">
    <div class="topbar">
      <div class="left"><button onclick="cancelEntry()">Cancel</button></div>
      <div class="title">New Entry</div>
      <div class="right"><button class="save-btn" id="saveBtn" onclick="saveEntry()" disabled>Save</button></div>
    </div>
    <div class="entry-body">
      <div class="vin-pill" id="vinPill">—</div>
      <div class="vin-decoded" id="vinDecoded">—</div>

      <div class="section-label">Colour</div>
      <div class="colours" id="colourGrid"></div>

      <div class="section-label">Model</div>
      <div class="trims" id="trimGrid"></div>

      <div class="section-label">Details</div>
      <div class="field-row">
        <label for="keyInput">Key #</label>
        <input id="keyInput" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="next" />
      </div>
      <div class="field-row">
        <label for="mfgInput">Mfg ID</label>
        <input id="mfgInput" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="done" />
      </div>
      <div style="height: 80px"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
  // ============================================================
  // Triton AU colour palette — edit freely
  // ============================================================
  const COLOURS = [
    { name: 'White Diamond',   hex: '#F2F2F0' },
    { name: 'Sterling Silver', hex: '#B7B9BC' },
    { name: 'Graphite Grey',   hex: '#4A4D52' },
    { name: 'Black Mica',      hex: '#14171C' },
    { name: 'Impulse Blue',    hex: '#2E4F73' },
    { name: 'Red Solid',       hex: '#B71F2A' },
    { name: 'Yamabuki Orange', hex: '#D87231' },
    { name: 'Other',           hex: '#cccccc' },
  ];

  // ============================================================
  // Trim options by VIN config — body code (pos 4) + drive (pos 7)
  // ============================================================
  const TRIMS_BY_CONFIG = {
    'CC': ['GLX+'],                              // Club Cab Pickup 4x4
    'JB': ['GLX'],                               // Dual Cab Pickup 4x2
    'JC': ['GLX+', 'GLX-R', 'GLS', 'GSR'],       // Dual Cab Pickup 4x4
    'WC': ['GLX'],                               // Club Cab CC 4x4
    'YB': ['GLX'],                               // Single Cab CC 4x2
    'YC': ['GLX'],                               // Single Cab CC 4x4
    'ZC': ['GLX', 'GLS', 'GSR'],                 // Dual Cab CC 4x4
  };

  // ============================================================
  // VIN decode
  // ============================================================
  function decodeFromVIN(vin) {
    if (!vin || vin.length !== 17 || vin.slice(0,3).toUpperCase() !== 'MMA') return null;
    const v = vin.toUpperCase();
    const bodyMap  = { 'C':'Club Cab Pickup','J':'Dual Cab Pickup','W':'Club Cab Cab Chassis','Y':'Single Cab Cab Chassis','Z':'Dual Cab Cab Chassis' };
    const transMap = { 'J':'Manual','L':'Auto' };
    const driveMap = { 'B':'4x2','C':'4x4' };
    return {
      bodyCode:  v[3],
      driveCode: v[6],
      body:  bodyMap[v[3]]  || '?',
      trans: transMap[v[4]] || '?',
      drive: driveMap[v[6]] || '?',
    };
  }
  function availableTrims(d) {
    if (!d) return ['GLX'];
    return TRIMS_BY_CONFIG[d.bodyCode + d.driveCode] || ['GLX'];
  }

  // ============================================================
  // Storage
  // ============================================================
  function loadRecords() {
    try { return JSON.parse(localStorage.getItem('triton_records_v2') || '[]'); }
    catch (e) { return []; }
  }
  function saveRecords(r) { localStorage.setItem('triton_records_v2', JSON.stringify(r)); }

  function renderRecords() {
    const records = loadRecords();
    document.getElementById('recCount').textContent = records.length;
    const el = document.getElementById('records');
    if (records.length === 0) {
      el.innerHTML = '<div class="empty"><div class="big">＋</div>No vehicles scanned yet.<br>Tap the <b>+</b> button to start.</div>';
      return;
    }
    el.innerHTML = records.slice().reverse().map((r, displayIdx) => {
      const actualIdx = records.length - 1 - displayIdx;
      const dec = decodeFromVIN(r.vin) || {};
      const colour = COLOURS.find(c => c.name === r.colour) || { hex: '#ccc' };
      return `
        <div class="record">
          <button class="del" onclick="deleteRecord(${actualIdx})">✕</button>
          <div class="top-line">
            <div class="swatch" style="background:${colour.hex}"></div>
            <div class="trim">${r.trim || '?'} ${r.colour ? '— ' + r.colour : ''}</div>
          </div>
          <div class="body-line">${dec.body || '?'} · ${dec.drive || '?'} · ${dec.trans || '?'}</div>
          <div class="meta">
            <span>Key <b>${r.key || '—'}</b></span>
            <span>Mfg <b>${r.mfg || '—'}</b></span>
          </div>
          <div class="vin">VIN: ${r.vin}</div>
        </div>`;
    }).join('');
  }

  function deleteRecord(idx) {
    if (!confirm('Delete this entry?')) return;
    const records = loadRecords();
    records.splice(idx, 1);
    saveRecords(records);
    renderRecords();
  }

  // ============================================================
  // Scan
  // ============================================================
  let videoStream = null;
  let scanRAF = null;
  let savedThisSession = 0;

  async function startScan() {
    document.getElementById('home').style.display = 'none';
    document.getElementById('entry').style.display = 'none';
    document.getElementById('scan').style.display = 'block';
    document.getElementById('banner').textContent = 'Scan VIN QR code';
    document.getElementById('banner').classList.remove('success');

    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      const video = document.getElementById('video');
      video.srcObject = videoStream;
      await video.play();
      scanLoop();
      return true;
    } catch (e) {
      alert('Camera access denied. Allow Camera in iPhone Settings → Safari, then reload.');
      cancelScan();
      return false;
    }
  }

  function scanLoop() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
      if (code && code.data) {
        const cleaned = code.data.replace(/[^A-Z0-9]/gi, '').toUpperCase();
        const match = cleaned.match(/MMA[A-HJ-NPR-Z0-9]{14}/);
        if (match) {
          if (navigator.vibrate) navigator.vibrate(80);
          try {
            const ac = new (window.AudioContext || window.webkitAudioContext)();
            const o = ac.createOscillator(), g = ac.createGain();
            o.frequency.value = 1200; o.connect(g); g.connect(ac.destination);
            g.gain.value = 0.1; o.start(); o.stop(ac.currentTime + 0.08);
          } catch (e) {}
          stopCamera();
          openEntry(match[0]);
          return;
        }
      }
    }
    scanRAF = requestAnimationFrame(scanLoop);
  }

  function stopCamera() {
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
    if (scanRAF) cancelAnimationFrame(scanRAF);
  }

  function cancelScan() {
    stopCamera();
    document.getElementById('scan').style.display = 'none';
    document.getElementById('home').style.display = 'flex';
    renderRecords();
  }

  // ============================================================
  // Entry screen
  // ============================================================
  let currentEntry = { vin: '', colour: '', trim: '', key: '', mfg: '' };

  function openEntry(vin) {
    currentEntry = { vin, colour: '', trim: '', key: '', mfg: '' };

    document.getElementById('scan').style.display = 'none';
    document.getElementById('entry').style.display = 'flex';

    const dec = decodeFromVIN(vin);
    document.getElementById('vinPill').textContent = vin;
    document.getElementById('vinDecoded').textContent = dec
      ? `${dec.body} · ${dec.drive} · ${dec.trans}`
      : 'Unrecognised VIN';

    // Colours
    const cg = document.getElementById('colourGrid');
    cg.innerHTML = COLOURS.map((c, i) => `
      <button class="colour-btn" data-i="${i}" onclick="pickColour(${i})">
        <div class="swatch" style="background:${c.hex}"></div>
        <div class="name">${c.name}</div>
      </button>
    `).join('');

    // Trims (filtered)
    const trims = availableTrims(dec);
    const tg = document.getElementById('trimGrid');
    tg.className = 'trims cols-' + Math.min(4, trims.length);
    tg.innerHTML = trims.map(t => `
      <button class="trim-btn" onclick="pickTrim('${t.replace(/'/g, "\\'")}')">${t}</button>
    `).join('');

    // Auto-select if only one trim possible (saves a tap)
    if (trims.length === 1) pickTrim(trims[0]);

    document.getElementById('keyInput').value = '';
    document.getElementById('mfgInput').value = '';
    updateSaveState();
  }

  function pickColour(i) {
    currentEntry.colour = COLOURS[i].name;
    document.querySelectorAll('.colour-btn').forEach(b => b.classList.remove('selected'));
    document.querySelector('.colour-btn[data-i="' + i + '"]').classList.add('selected');
    updateSaveState();
  }

  function pickTrim(trim) {
    currentEntry.trim = trim;
    document.querySelectorAll('.trim-btn').forEach(b => {
      b.classList.toggle('selected', b.textContent === trim);
    });
    updateSaveState();
  }

  function updateSaveState() {
    document.getElementById('saveBtn').disabled = !(currentEntry.colour && currentEntry.trim);
  }

  function cancelEntry() {
    document.getElementById('entry').style.display = 'none';
    document.getElementById('home').style.display = 'flex';
    renderRecords();
  }

  async function saveEntry() {
    currentEntry.key = document.getElementById('keyInput').value.trim().toUpperCase();
    currentEntry.mfg = document.getElementById('mfgInput').value.trim().toUpperCase();
    if (!currentEntry.colour || !currentEntry.trim) return;

    const records = loadRecords();
    records.push({ ...currentEntry, t: Date.now() });
    saveRecords(records);
    savedThisSession++;

    // Dismiss keyboard so camera screen isn't covered
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

    // Straight back to camera for next vehicle
    const ok = await startScan();
    if (ok) showToast('✓ Saved · ' + savedThisSession + ' this session');
  }

  function showToast(text) {
    const t = document.getElementById('scanToast');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ============================================================
  // CSV export
  // ============================================================
  function exportCSV() {
    const records = loadRecords();
    if (records.length === 0) { alert('No records to export yet.'); return; }
    const cols = ['When','VIN','Trim','Colour','Body','Drive','Transmission','Key','Mfg ID'];
    let csv = cols.join(',') + '\n';
    records.forEach(r => {
      const d = decodeFromVIN(r.vin) || {};
      const row = [
        new Date(r.t).toISOString(),
        r.vin || '', r.trim || '', r.colour || '',
        d.body || '', d.drive || '', d.trans || '',
        r.key || '', r.mfg || '',
      ];
      csv += row.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'triton_scans_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ============================================================
  // Wire up
  // ============================================================
  document.getElementById('fab').addEventListener('click', startScan);
  document.getElementById('keyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('mfgInput').focus(); }
  });
  document.getElementById('mfgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!document.getElementById('saveBtn').disabled) saveEntry();
    }
  });

  renderRecords();
  </script>
</body>
</html>
